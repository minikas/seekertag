appId: app.seekertag.mobile
name: Android account, label, clipboard, PDF picker, visitor and app links
---
- stopApp
- launchApp
- tapOn:
    text: "Ahora no|Agora não|Not Now|Never"
    optional: true
- runFlow:
    when:
      visible: "Minha conta"
    commands:
      - tapOn: "Minha conta"
      - scrollUntilVisible:
          element: "Sair da conta"
          direction: DOWN
      - tapOn: "Sair da conta"
- scrollUntilVisible:
    element: "Entrar com e-mail"
    direction: DOWN
- tapOn: "Entrar com e-mail"
- tapOn: "email@example.com"
- inputText: ${QA_EMAIL}
- pressKey: Enter
- scrollUntilVisible:
    element: "Sua senha"
    direction: DOWN
- tapOn: "Sua senha"
- inputText: ${QA_PASSWORD}
- pressKey: Enter
- tapOn:
    text: "Ahora no|Agora não|Not Now|Never"
    optional: true
- extendedWaitUntil:
    visible: "Adicionar objeto"
    timeout: 20000
- takeScreenshot: native-dashboard
- tapOn: "Adicionar objeto"
- tapOn: "Ex.: Minha mochila verde"
- inputText: ${QA_OBJECT_NAME}
- pressKey: Enter
- tapOn: "Chaves"
- scrollUntilVisible:
    element: "Criar etiqueta"
    direction: DOWN
- tapOn: "Criar etiqueta"
- extendedWaitUntil:
    visible: "Link da etiqueta"
    timeout: 20000
- assertVisible: ${QA_OBJECT_NAME}
- takeScreenshot: native-created-qr
- scrollUntilVisible:
    element: "Copiar link"
    direction: DOWN
- tapOn: "Copiar link"
# The transient copy toast is not a persistent assertion target. Opening the
# clipboard value below verifies that the link was copied successfully.
- tapOn: "Fechar"
- tapOn: "Escanear etiqueta"
# Use Android's actual clipboard, not Maestro's separate pasteText buffer.
- longPressOn: "https://…/found/sua-etiqueta"
- tapOn: "Paste|Colar|Pegar"
- hideKeyboard
- tapOn: "Abrir etiqueta"
- extendedWaitUntil:
    visible: ${QA_OBJECT_NAME}
    timeout: 20000
- back
- scrollUntilVisible:
    element: "Abrir ${QA_OBJECT_NAME}"
    direction: DOWN
- tapOn: "Abrir ${QA_OBJECT_NAME}"
- tapOn: "Opções do objeto"
- tapOn: "Ver como visitante"
- extendedWaitUntil:
    visible: ${QA_OBJECT_NAME}
    timeout: 20000
- assertVisible: "Página inicial"
- back
- scrollUntilVisible:
    element: "Abrir ${QA_OBJECT_NAME}"
    direction: DOWN
- tapOn: "Abrir ${QA_OBJECT_NAME}"
- scrollUntilVisible:
    element: "Baixar PDF"
    direction: DOWN
- tapOn: "Baixar PDF"
- extendedWaitUntil:
    visible: ".*(USE THIS FOLDER|Usar esta pasta|USAR ESTA PASTA|Usar esta carpeta).*"
    timeout: 10000
- back
- assertVisible: "Baixar PDF"
- tapOn: "Fechar"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Adicionar objeto"
    timeout: 20000
- scrollUntilVisible:
    element: "Abrir ${QA_OBJECT_NAME}"
    direction: DOWN
- assertVisible: "Abrir ${QA_OBJECT_NAME}"
- takeScreenshot: native-persisted-session
- tapOn: "Escanear etiqueta"
- tapOn: "https://…/found/sua-etiqueta"
- inputText: ${QA_PUBLIC_URL}
- pressKey: Enter
- extendedWaitUntil:
    visible: ${QA_PUBLIC_OBJECT_NAME}
    timeout: 20000
- scrollUntilVisible:
    element: "Seu primeiro nome ou apelido"
    direction: DOWN
- tapOn: "Seu primeiro nome ou apelido"
- inputText: "Native QA"
- pressKey: Enter
- scrollUntilVisible:
    element: "Conte onde encontrou o objeto."
    direction: DOWN
- tapOn: "Conte onde encontrou o objeto."
- inputText: ${QA_MESSAGE}
- hideKeyboard
- scrollUntilVisible:
    element: "Avisar o dono"
    direction: DOWN
- tapOn: "Avisar o dono"
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- takeScreenshot: native-finder-chat
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Adicionar objeto"
    timeout: 20000
- tapOn: "Escanear etiqueta"
- tapOn: "https://…/found/sua-etiqueta"
- inputText: ${QA_PUBLIC_URL}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-persisted-finder
- back
- openLink: ${QA_APP_URL}
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-warm-link
- stopApp
- openLink: ${QA_APP_URL}
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-cold-link
