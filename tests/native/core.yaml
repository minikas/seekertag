appId: app.seekertag.mobile
name: Native login, object, QR fallback and secure session
---
- stopApp
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            camera: deny
- tapOn:
    text: "Ahora no|Agora não|Not Now|Never"
    optional: true
- runFlow:
    when:
      visible: "Minha conta"
    commands:
      - tapOn: "Minha conta"
      - scrollUntilVisible:
          element: "Sair da conta"
          direction: DOWN
      - tapOn: "Sair da conta"
- scrollUntilVisible:
    element: "Entrar"
    direction: DOWN
- tapOn: "Entrar"
- tapOn: "voce@exemplo.com"
- inputText: ${QA_EMAIL}
- pressKey: Enter
- scrollUntilVisible:
    element: "Sua senha"
    direction: DOWN
- tapOn: "Sua senha"
- inputText: ${QA_PASSWORD}
- pressKey: Enter
- tapOn:
    text: "Ahora no|Agora não|Not Now|Never"
    optional: true
- extendedWaitUntil:
    visible: "Minha conta"
    timeout: 20000
- assertNotVisible: ".*KeyChainException.*"
- takeScreenshot: native-dashboard
- tapOn: "Criar etiqueta"
- tapOn: "Ex.: Minha mochila"
- inputText: ${QA_OBJECT_NAME}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Etiqueta criada"
    timeout: 20000
- assertVisible: ${QA_OBJECT_NAME}
- takeScreenshot: native-created-qr
- tapOn: "Fechar"
- stopApp
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            camera: deny
- extendedWaitUntil:
    visible: "Minha conta"
    timeout: 20000
- scrollUntilVisible:
    element: "Abrir ${QA_OBJECT_NAME}"
    direction: DOWN
- assertVisible: "Abrir ${QA_OBJECT_NAME}"
- takeScreenshot: native-persisted-session
- tapOn: "Escanear etiqueta"
- tapOn: "https://…/found/sua-etiqueta"
- runFlow:
    when:
      platform: Android
    commands:
      - eraseText
- inputText: ${QA_PUBLIC_URL}
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Abrir etiqueta"
          direction: DOWN
      - assertVisible: ".*${QA_PUBLIC_URL}"
      - assertVisible: "Abrir etiqueta"
      - takeScreenshot: native-reader-keyboard
      - pressKey: Back
      - assertVisible: "Ler etiqueta"
      - assertVisible: ".*${QA_PUBLIC_URL}"
      - tapOn: "Abrir etiqueta"
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- extendedWaitUntil:
    visible: ${QA_PUBLIC_OBJECT_NAME}
    timeout: 20000
- scrollUntilVisible:
    element: ".*Oi! Encontrei seu objeto. Podemos combinar a devolução por aqui."
    direction: DOWN
- tapOn: ".*Oi! Encontrei seu objeto. Podemos combinar a devolução por aqui."
- inputText: ${QA_MESSAGE}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${QA_PUBLIC_OBJECT_NAME}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: "Avisar o dono"
    direction: DOWN
- tapOn: "Avisar o dono"
- extendedWaitUntil:
    visible: "Obrigado por ajudar."
    timeout: 20000
- takeScreenshot: native-finder-chat
- stopApp
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            camera: deny
- extendedWaitUntil:
    visible: "Minha conta"
    timeout: 20000
- scrollUntilVisible:
    element: "Minhas conversas"
    direction: DOWN
- tapOn: "Minhas conversas"
- scrollUntilVisible:
    element: "Abrir conversa sobre ${QA_PUBLIC_OBJECT_NAME}"
    direction: DOWN
- tapOn: "Abrir conversa sobre ${QA_PUBLIC_OBJECT_NAME}"
- extendedWaitUntil:
    visible: "Obrigado por ajudar."
    timeout: 20000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-persisted-finder
