# Run after core.yaml, with QA_PUBLIC_OBJECT_NAME from that run's result.json.
# The keyboard screenshot is part of acceptance: the send action must be exposed.
appId: app.seekertag.mobile
name: Native keyboard compositor, durable draft and message
---
- assertVisible: "Obrigado por ajudar."
- tapOn: ".*Combine a entrega em um lugar público…"
- inputText: "Rascunho nativo preservado depois de reiniciar."
- assertVisible: "Enviar"
- assertVisible: "Rascunho nativo preservado depois de reiniciar."
- takeScreenshot: native-composer-keyboard
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Minha conta"
    timeout: 20000
- scrollUntilVisible:
    element: "Minhas conversas"
    direction: DOWN
- tapOn: "Minhas conversas"
- scrollUntilVisible:
    element: "Abrir conversa sobre ${QA_PUBLIC_OBJECT_NAME}"
    direction: DOWN
- tapOn: "Abrir conversa sobre ${QA_PUBLIC_OBJECT_NAME}"
- extendedWaitUntil:
    visible: "Rascunho nativo preservado depois de reiniciar."
    timeout: 20000
- takeScreenshot: native-composer-persisted-draft
- tapOn: "Rascunho nativo preservado depois de reiniciar."
- assertVisible: "Enviar"
- tapOn: "Enviar"
- extendedWaitUntil:
    visible: ".*Combine a entrega em um lugar público…"
    timeout: 20000
- assertVisible: "Rascunho nativo preservado depois de reiniciar."
- takeScreenshot: native-composer-sent
