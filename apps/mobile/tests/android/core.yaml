appId: app.seekertag.mobile
name: Android account, label, sharing, PDF picker, visitor and app links
---
- stopApp
- launchApp
- tapOn:
    text: "Ahora no|Agora não|Not Now|Never"
    optional: true
# Start with a dedicated QA account already signed in through a supported provider.
# Wallet and social-provider approvals remain manual; this flow never signs for the user.
- extendedWaitUntil:
    visible: "Adicionar objeto"
    timeout: 20000
- takeScreenshot: native-dashboard
- tapOn: "Adicionar objeto"
- tapOn: "Ex.: Minha mochila verde"
- inputText: ${QA_OBJECT_NAME}
- pressKey: Enter
- tapOn: "Chaves"
- scrollUntilVisible:
    element: "Criar etiqueta"
    direction: DOWN
- tapOn: "Criar etiqueta"
- extendedWaitUntil:
    visible: "Compartilhar link"
    timeout: 20000
- assertVisible: ${QA_OBJECT_NAME}
- takeScreenshot: native-created-qr
- assertNotVisible: "Link da etiqueta"
- tapOn: "Compartilhar link"
- back
- assertVisible: "Baixar PDF"
- tapOn: "Fechar"
- scrollUntilVisible:
    element: "Abrir ${QA_OBJECT_NAME}"
    direction: DOWN
- tapOn: "Abrir ${QA_OBJECT_NAME}"
- tapOn: "Opções do objeto"
- tapOn: "Ver como visitante"
- extendedWaitUntil:
    visible: ${QA_OBJECT_NAME}
    timeout: 20000
- assertVisible: "Página inicial"
- assertVisible: "Esta etiqueta é sua"
- assertNotVisible: "Avisar o dono"
- back
- scrollUntilVisible:
    element: "Abrir ${QA_OBJECT_NAME}"
    direction: DOWN
- tapOn: "Abrir ${QA_OBJECT_NAME}"
- scrollUntilVisible:
    element: "Baixar PDF"
    direction: DOWN
- tapOn: "Baixar PDF"
- extendedWaitUntil:
    visible: ".*(USE THIS FOLDER|Usar esta pasta|USAR ESTA PASTA|Usar esta carpeta).*"
    timeout: 10000
- back
- assertVisible: "Baixar PDF"
- tapOn: "Fechar"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Adicionar objeto"
    timeout: 20000
- scrollUntilVisible:
    element: "Abrir ${QA_OBJECT_NAME}"
    direction: DOWN
- assertVisible: "Abrir ${QA_OBJECT_NAME}"
- takeScreenshot: native-persisted-session
- tapOn: "Escanear etiqueta"
- tapOn: "Link da etiqueta"
- inputText: ${QA_PUBLIC_URL}
- pressKey: Enter
- extendedWaitUntil:
    visible: ${QA_PUBLIC_OBJECT_NAME}
    timeout: 20000
- scrollUntilVisible:
    element: "Seu primeiro nome ou apelido"
    direction: DOWN
- tapOn: "Seu primeiro nome ou apelido"
- inputText: "Native QA"
- pressKey: Enter
- scrollUntilVisible:
    element: "Conte onde encontrou o objeto."
    direction: DOWN
- tapOn: "Conte onde encontrou o objeto."
- inputText: ${QA_MESSAGE}
- hideKeyboard
- scrollUntilVisible:
    element: "Avisar o dono"
    direction: DOWN
- tapOn: "Avisar o dono"
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- takeScreenshot: native-finder-chat
- tapOn: "Ver objeto"
- extendedWaitUntil:
    visible: "Detalhes do objeto"
    timeout: 10000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-finder-details
- back
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Adicionar objeto"
    timeout: 20000
- tapOn: "Escanear etiqueta"
- tapOn: "Link da etiqueta"
- inputText: ${QA_PUBLIC_URL}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-persisted-finder
- back
- openLink: ${QA_APP_URL}
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-warm-link
- stopApp
- openLink: ${QA_APP_URL}
- extendedWaitUntil:
    visible: "Conversa"
    timeout: 20000
- assertVisible: ${QA_PUBLIC_OBJECT_NAME}
- takeScreenshot: native-cold-link
