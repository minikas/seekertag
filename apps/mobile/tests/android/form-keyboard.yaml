appId: app.seekertag.mobile
name: Form focus stays visible and dismissing the keyboard preserves the section
---
# Start on the signed-in dashboard. This flow only edits and discards a draft.
- tapOn:
    id: "tab-items"
- tapOn: "Adicionar objeto"
- tapOn:
    id: "object-name"
- inputText: "QA draft"
- hideKeyboard
- scrollUntilVisible:
    element: "Gerenciar categorias"
    direction: DOWN
- tapOn: "Gerenciar categorias"
- assertVisible: "Categorias"
- back
- scrollUntilVisible:
    element:
      id: "object-name"
    direction: UP
- assertVisible: "QA draft"
- scrollUntilVisible:
    element:
      id: "object-reward"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "object-reward"
- inputText: "25"
- assertVisible: "25"
- takeScreenshot: reward-keyboard
# An unhandled tap in the form dismisses the IME, just as a user taps outside.
- tapOn: "Recompensa \\(Opcional\\)"
- assertVisible: "25"
- assertNotVisible: "Nome do objeto"
- takeScreenshot: reward-keyboard-dismissed
- tapOn:
    id: "object-reward"
- assertVisible: "25"
# Maestro scrollUntilVisible swipes across the window midpoint; with the IME
# open that crosses the fixed submit footer instead of the scrollable content.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "object-message"
    direction: UP
    centerElement: true
- tapOn:
    id: "object-message"
- inputText: " QA"
- assertVisible:
    id: "object-message"
- takeScreenshot: message-keyboard
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "object-reward"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "object-reward"
- assertVisible: "25"
- hideKeyboard
- assertVisible: "25"
- assertNotVisible: "Nome do objeto"
- back
- assertVisible: "Adicionar objeto"
